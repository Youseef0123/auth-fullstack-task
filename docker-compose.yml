# Production-like stack: browser -> nginx (8080) -> Next.js -> NestJS -> MongoDB.
# Only nginx is published to the host. Secrets come from ./.env (see .env.example).
name: auth-fullstack-task

services:
  mongo:
    # 8.2: mongo:8.0 (8.0.34) and 9.0 refuse to start on Linux >= 6.19 (SERVER-121912),
    # e.g. on current GitHub runners; 8.2.12 ships the fixed tcmalloc.
    image: mongo:8.2
    restart: unless-stopped
    user: "999:999"
    volumes:
      - mongo-data:/data/db
    networks: [data]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/auth-fullstack-task
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env and set it}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: http://localhost:8080
      THROTTLE_TTL_MS: "60000"
      THROTTLE_LIMIT: "5"
      # nginx overwrites X-Forwarded-For with the client address and Next.js passes
      # it through unchanged, so trust exactly one hop: the Next.js server.
      TRUST_PROXY: "1"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [data, app]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [app, edge]

  nginx:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:

# edge: nginx <-> Next.js, app: Next.js <-> API, data: API <-> MongoDB.
networks:
  edge:
  app:
  data:
