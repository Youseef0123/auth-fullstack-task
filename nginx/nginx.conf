# Edge proxy for docker-compose: the only service published to the host.
# Runs on nginxinc/nginx-unprivileged (non-root), so pid and temp paths live in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  # Auth payloads are a few hundred bytes; refuse large bodies at the edge.
  client_max_body_size 64k;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  upstream frontend {
    server frontend:3000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      # OVERWRITE (never append) X-Forwarded-For with the address nginx sees, so a
      # client cannot pick its own rate-limit bucket. Next.js passes it through
      # unchanged and the API trusts exactly that one hop (TRUST_PROXY=1).
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }
  }
}
